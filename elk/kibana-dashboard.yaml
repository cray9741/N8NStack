apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-dashboard
  namespace: logging
  annotations: 
    cert-manager.io/issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - elk-dev.cloudlockops.io
    secretName: elk-dev-tls
  rules:
  - host: elk-dev.cloudlockops.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana-kibana
            port:
              number: 5601