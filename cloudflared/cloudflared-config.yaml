apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-n8n-hooks-config
  namespace: n8n
data:
  config.yaml: |
    tunnel: n8n-hooks-dev
    credentials-file: /etc/cloudflared/credentials.json

    ingress:
      - hostname: hooks-dev.cloudlockops.io
        service: http://n8n-service.n8n.svc.cluster.local:5678
      - service: http_status:404
