apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-n8n-hooks
  namespace: n8n
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-n8n-hooks
  template:
    metadata:
      labels:
        app: cloudflared-n8n-hooks
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
            - name: creds
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-n8n-hooks-config
        - name: creds
          secret:
            secretName: cloudflared-n8n-hooks-cred
