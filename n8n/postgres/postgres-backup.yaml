apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-pg-backup
  namespace: n8n
spec:
  schedule: "15 2 * * *"   # 2:15 AM daily
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 4
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:16
              env:
                - name: PGHOST
                  value: "postgres-service.n8n.svc.cluster.local"
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: n8n-secrets
                      key: POSTGRES_DB
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: n8n-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: n8n-secrets
                      key: POSTGRES_PASSWORD

                - name: S3_BUCKET
                  value: "n8n_db_backup"
                - name: S3_PREFIX
                  value: "backups/n8n/db_backups"

                # AWS creds + region + KMS key from secret created by your script
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_DEFAULT_REGION
                - name: KMS_KEY_ARN
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: KMS_KEY_ARN

              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  echo "Installing awscli..."
                  apt-get update -qq
                  apt-get install -y -qq awscli gzip
                  rm -rf /var/lib/apt/lists/*

                  TS="$(date -u +%F_%H%M%S)"
                  KEY="${S3_PREFIX}/n8n_${PGDATABASE}_${TS}.sql.gz"

                  echo "Running pg_dump and uploading with SSE-KMS..."
                  pg_dump \
                    --no-owner \
                    --no-privileges \
                    -h "${PGHOST}" \
                    -p "${PGPORT}" \
                    -U "${PGUSER}" \
                    "${PGDATABASE}" \
                  | gzip -c \
                  | aws s3 cp - "s3://${S3_BUCKET}/${KEY}" \
                      --sse aws:kms \
                      --sse-kms-key-id "${KMS_KEY_ARN}"

                  echo "Backup uploaded to s3://${S3_BUCKET}/${KEY}"
