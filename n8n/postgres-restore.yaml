apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-pg-restore
  namespace: n8n
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pg-restore
          image: postgres:16
          env:
            - name: PGHOST
              value: "postgres-service.n8n.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_PASSWORD

            - name: S3_BUCKET
              value: "n8n_db_backup"
            - name: S3_PREFIX
              value: "backups/n8n/db_backups"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_DEFAULT_REGION

          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              echo "Installing awscli..."
              apt-get update -qq
              apt-get install -y -qq awscli gzip ca-certificates
              rm -rf /var/lib/apt/lists/*

              echo "Finding latest backup in s3://${S3_BUCKET}/${S3_PREFIX}/ ..."
              latest_backup="$(aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" | awk '{print $4}' | sort | tail -n 1)"

              if [ -z "${latest_backup}" ]; then
                echo "ERROR: No backups found at s3://${S3_BUCKET}/${S3_PREFIX}/"
                exit 1
              fi

              echo "Latest backup file: ${latest_backup}"
              aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}/${latest_backup}" "/backup/${latest_backup}"

              # Build a dump reader command (gz or plain sql)
              if echo "${latest_backup}" | grep -qE '\.gz$'; then
                DUMP_CMD="gzip -dc /backup/${latest_backup}"
              else
                DUMP_CMD="cat /backup/${latest_backup}"
              fi

              echo "Preflight: can we connect?"
              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -c "SELECT now();" -v ON_ERROR_STOP=1

              echo "Wiping schema (public) and recreating..."
              # This avoids needing DROP DATABASE privileges and is usually enough for full restore
              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -v ON_ERROR_STOP=1 <<'SQL'
              BEGIN;
              DROP SCHEMA IF EXISTS public CASCADE;
              CREATE SCHEMA public;
              GRANT ALL ON SCHEMA public TO CURRENT_USER;
              GRANT ALL ON SCHEMA public TO public;
              COMMIT;
              SQL

              echo "Restoring into ${PGDATABASE}..."
              sh -c "${DUMP_CMD}" | psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -v ON_ERROR_STOP=1

              echo "Restore complete."

          volumeMounts:
            - name: backup-volume
              mountPath: /backup
      volumes:
        - name: backup-volume
          emptyDir: {}
