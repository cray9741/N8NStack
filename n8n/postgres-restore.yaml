apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-pg-restore
  namespace: n8n
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pg-restore
          image: postgres:16
          env:
            - name: PGHOST
              value: "postgres-service.n8n.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_PASSWORD
            - name: S3_BUCKET
              value: "tools-bucket-cloudranger-30293812"
            - name: S3_PREFIX
              value: "backups/n8n/db_backups"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"


            # ---- AWS creds (use one method) ----
            # If using a secret:
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: aws-credentials
            #       key: AWS_ACCESS_KEY_ID
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: aws-credentials
            #       key: AWS_SECRET_ACCESS_KEY

          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              echo "Installing awscli..."
              apt-get update -qq
              apt-get install -y -qq awscli gzip
              rm -rf /var/lib/apt/lists/*

              echo "Locating latest backup in S3..."
              latest_backup="$(aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" | awk '{print $4}' | sort | tail -n 1)"

              if [ -z "${latest_backup}" ]; then
                echo "ERROR: No backups found"
                exit 1
              fi

              echo "Latest backup: ${latest_backup}"
              aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}/${latest_backup}" "/backup/${latest_backup}"

              if echo "${latest_backup}" | grep -q '\.gz$'; then
                DUMP_CMD="gzip -dc /backup/${latest_backup}"
              else
                DUMP_CMD="cat /backup/${latest_backup}"
              fi

              echo "Dropping and recreating database '${PGDATABASE}'..."

              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres <<SQL
              SELECT pg_terminate_backend(pid)
              FROM pg_stat_activity
              WHERE datname = '${PGDATABASE}'
                AND pid <> pg_backend_pid();

              DROP DATABASE IF EXISTS "${PGDATABASE}";
              CREATE DATABASE "${PGDATABASE}";
SQL

              echo "Restoring database..."
              sh -c "${DUMP_CMD}" | psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}"

              echo "Restore completed successfully."

          volumeMounts:
            - name: backup-volume
              mountPath: /backup
      volumes:
        - name: backup-volume
          emptyDir: {}
