apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      serviceAccountName: n8n-k8s
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ['sh','-c','until pg_isready -h postgres-service -p 5432; do echo "waiting for postgres"; sleep 2; done']
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n
          ports:
            - containerPort: 5678
          env:
            - name: GENERIC_TIMEZONE
              value: "America/New_York"
            - name: TZ
              value: "America/New_York"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_SECURE_COOKIE
              value: "true"
            - name: N8N_HOST
              value: n8n-dev.cloudlockops.io
            - name: WEBHOOK_URL
              value: "https://hooks-dev.cloudlockops.io/"
            - name: N8N_PROTOCOL
              value: "https"

            # From Secret created by the bootstrap Job
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
            
            # - name: PASSNINJA_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: passninja-auth
            #       key: PASSNINJA_API_KEY
            # - name: PASSNINJA_ACCOUNT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: passninja-auth
            #       key: PASSNINJA_ACCOUNT_ID

            # PostgreSQL backend
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "postgres-service"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_DB
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_PASSWORD
