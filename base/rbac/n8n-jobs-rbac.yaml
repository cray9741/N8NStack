apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-k8s
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-jobs-role
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create","get","list","watch","delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-jobs-rb
  namespace: default
subjects:
  - kind: ServiceAccount
    name: n8n-k8s
    namespace: default
roleRef:
  kind: Role
  name: n8n-jobs-role
  apiGroup: rbac.authorization.k8s.io
