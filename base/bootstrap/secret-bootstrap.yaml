---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-bootstrap
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-bootstrap-secrets
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["n8n-secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-bootstrap-secrets-rb
  namespace: default
subjects:
  - kind: ServiceAccount
    name: n8n-bootstrap
    namespace: default
roleRef:
  kind: Role
  name: n8n-bootstrap-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-secret-bootstrap
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: n8n-secret-bootstrap
    spec:
      serviceAccountName: n8n-bootstrap
      restartPolicy: Never
      containers:
        - name: create-secret
          image: bitnami/kubectl:1.30
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              NS=${NAMESPACE:-default}
              API="https://kubernetes.default.svc"
              CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              K="kubectl --server=${API} --certificate-authority=${CA} --token=${TOKEN} -n ${NS}"

              if ${K} get secret n8n-secrets >/dev/null 2>&1; then
                echo "Secret n8n-secrets already exists. Nothing to do."
                exit 0
              fi

              # Generate ~64-char base64 string and ~32-char password
              ENC_KEY="$(head -c 48 /dev/urandom | base64)"
              DB_PASS="$(head -c 24 /dev/urandom | base64)"

              ${K} create secret generic n8n-secrets \
                --from-literal=N8N_ENCRYPTION_KEY="${ENC_KEY}" \
                --from-literal=POSTGRES_DB=n8n \
                --from-literal=POSTGRES_USER=n8n \
                --from-literal=POSTGRES_PASSWORD="${DB_PASS}"

              echo "Secret n8n-secrets created."
