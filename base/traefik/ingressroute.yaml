apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dev.raguls.in`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: n8n-service
          port: 5678
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-websecure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dev.raguls.in`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: secure-headers
      services:
        - name: n8n-service
          port: 5678
  tls:
    secretName: dev-raguls-in-tls
